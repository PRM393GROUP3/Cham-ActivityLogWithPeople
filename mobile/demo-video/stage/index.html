<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chấm — sân khấu quay video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF6F0; --ink: #1F1A17; --muted: #7E7268; --coral: #FF6F52; --brick: #B53216;
    --night: #14100E; --W: 1920px; --H: 1080px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--cream); font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: var(--ink); }
  body.vertical { --W: 1080px; --H: 1920px; }

  /* ---------- nền ---------- */
  #bg { position: absolute; inset: 0; background:
      radial-gradient(900px 600px at 18% 20%, #FFE9DE 0%, transparent 70%),
      radial-gradient(800px 700px at 85% 85%, #FDE2D6 0%, transparent 70%), var(--cream); }
  .dotgrid { position: absolute; inset: 0; opacity: .35;
      background-image: radial-gradient(#E9D9CB 1.4px, transparent 1.6px); background-size: 34px 34px; }

  /* ---------- điện thoại ---------- */
  .phone { position: absolute; width: 414px; height: 868px; border-radius: 58px; padding: 12px;
      background: #201a17; box-shadow: 0 40px 90px rgba(80,40,20,.28), 0 0 0 2px #3a302b inset;
      transition: left 900ms cubic-bezier(.2,.8,.2,1), top 900ms cubic-bezier(.2,.8,.2,1), opacity 600ms, transform 900ms cubic-bezier(.2,.8,.2,1);
      opacity: 0; top: 80px; left: calc(var(--W) / 2 - 207px); transform: translateY(80px) scale(.96); }
  .phone { transform-origin: top center; }
  .phone.on { opacity: 1; transform: scale(.92); }
  .phone:not(.on) { pointer-events: none; }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 46px; background: var(--cream); display: block; }
  .tag { position: absolute; top: 28px; font-weight: 800; font-size: 30px; letter-spacing: -.5px; opacity: 0;
      transition: opacity 600ms, left 900ms cubic-bezier(.2,.8,.2,1); width: 414px; text-align: center; }
  .tag small { display: block; font-size: 17px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .tag.on { opacity: 1; }
  .side, .tag { pointer-events: none; }
  .side { position: absolute; top: 50%; transform: translateY(-50%); width: 520px; opacity: 0; transition: opacity 700ms; }
  .side.on { opacity: 1; }
  .side h2 { font-size: 64px; font-weight: 900; letter-spacing: -2px; line-height: 1.05; }
  .side p { margin-top: 18px; font-size: 25px; color: var(--muted); line-height: 1.45; }
  .side .chip { display: inline-block; margin-bottom: 18px; padding: 8px 16px; border-radius: 999px; background: #fff;
      font-weight: 800; color: var(--brick); font-size: 18px; box-shadow: 0 6px 20px rgba(181,50,22,.12); }

  /* ---------- thẻ kể chuyện (phủ toàn màn) ---------- */
  .card { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 900ms ease; overflow: hidden; }
  .card.on { opacity: 1; }
  .card.dark { background: var(--night); color: #F4ECE4; }
  .card.light { background: var(--cream); }

  /* intro: các chấm thành vòng Dial rồi thành logo */
  #intro .dot { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; border-radius: 50%;
      display: grid; place-items: center; font-size: 30px; background: rgba(255,255,255,.06);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; opacity: 0; transform: translate(0,0) scale(.2);
      transition: transform 1400ms cubic-bezier(.2,.9,.2,1), opacity 700ms, background 900ms; }
  #intro .dot::before { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--coral);
      box-shadow: 0 0 18px 4px rgba(255,111,82,.55); opacity: 1; transition: opacity 600ms; }
  #intro .dot span { opacity: 0; transition: opacity 600ms; }
  #intro.ringed .dot span { opacity: 1; } #intro.ringed .dot::before { opacity: 0; }
  #intro.ringed .dot { background: rgba(255,255,255,.08); }
  #intro.show-logo .dot { transform: translate(0,0) scale(.1) !important; opacity: 0 !important; transition-duration: 900ms; }
  #intro .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.14);
      transform: translate(-50%,-50%) scale(.6); opacity: 0; transition: all 1400ms cubic-bezier(.2,.9,.2,1); }
  #intro.ringed .ring { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #intro.show-logo .ring { opacity: 0; transform: translate(-50%,-50%) scale(.3); }
  .logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.8); opacity: 0;
      font-weight: 900; font-size: 150px; letter-spacing: -6px; transition: all 1000ms cubic-bezier(.2,.9,.2,1); white-space: nowrap; }
  .logo i { display: inline-block; width: 34px; height: 34px; border-radius: 50%; background: var(--coral); margin-left: 8px;
      box-shadow: 0 0 40px 8px rgba(255,111,82,.45); }
  #intro.show-logo .logo { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  /* map: Hà Nội — Sài Gòn */
  #map svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  #map .city { font-weight: 800; font-size: 34px; fill: #F4ECE4; }
  #map .km { font-size: 26px; fill: #b9a99c; font-weight: 500; }
  #map path.road { stroke: rgba(255,255,255,.35); stroke-width: 3; fill: none; stroke-dasharray: 10 12; }
  #map .traveler { transition: offset-distance 3s ease-in-out; }

  /* chat: gõ rồi xoá */
  #chat .box { position: absolute; left: 50%; top: 50%; width: 760px; transform: translate(-50%,-50%); }
  #chat .peer { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; font-size: 30px; font-weight: 800; }
  #chat .peer .av { width: 64px; height: 64px; border-radius: 50%; background: #fff3ea; display: grid; place-items: center; font-size: 34px; }
  #chat .seen { color: var(--muted); font-size: 22px; margin: -20px 0 40px 84px; font-weight: 500; }
  #chat .old { display: inline-block; background: #EFE8DE; padding: 18px 26px; border-radius: 26px 26px 26px 8px; font-size: 28px; margin-bottom: 18px; }
  #chat .input { margin-top: 160px; display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 40px; padding: 22px 30px;
      box-shadow: 0 14px 40px rgba(80,40,20,.12); font-size: 32px; min-height: 86px; }
  #chat .caret { width: 3px; height: 38px; background: var(--brick); animation: blink 1s steps(1) infinite; }
  #chat .send { margin-left: auto; width: 54px; height: 54px; border-radius: 50%; background: #E8DED3; display: grid; place-items: center; color: #fff; font-size: 26px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* khoa-night: điện thoại trong bóng tối, màn hình tắt */
  #night .ph { position: absolute; left: 50%; top: 50%; width: 330px; height: 660px; margin: -330px 0 0 -165px; border-radius: 48px;
      background: #0c0a09; box-shadow: 0 0 0 10px #221c19, 0 50px 120px rgba(0,0,0,.6); overflow: hidden; }
  #night .screen { position: absolute; inset: 0; background: linear-gradient(180deg,#2b2320,#1a1513); transition: opacity 1200ms; padding: 70px 26px; }
  #night .screen.off { opacity: 0; }
  #night .msg { background: #3a2f2a; color: #F4ECE4; border-radius: 22px; padding: 18px 20px; font-size: 22px; line-height: 1.35; }
  #night .msg b { display: block; font-size: 18px; color: #c9b6a8; margin-bottom: 6px; }
  #night .glow { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px; border-radius: 50%;
      background: radial-gradient(rgba(255,180,140,.16), transparent 60%); transition: opacity 1200ms; }
  #night .glow.off { opacity: 0; }

  /* silence: hai chấm, đường nối đứt rồi tắt */
  #silence svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  #silence line { stroke: rgba(255,255,255,.45); stroke-width: 3; stroke-dasharray: 8 12; transition: opacity 3.5s ease; }
  #silence line.gone { opacity: 0; }
  #silence circle.a, #silence circle.b { fill: var(--coral); transition: opacity 4s ease, r 4s ease; filter: drop-shadow(0 0 14px rgba(255,111,82,.6)); }
  #silence.fade circle.a, #silence.fade circle.b { opacity: .25; }

  /* outro */
  #outro .logo { opacity: 1; transform: translate(-50%,-62%) scale(1); font-size: 140px; color: var(--ink); }
  #outro .tagline { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font-size: 40px; font-weight: 700; color: var(--ink); opacity: 0; transition: opacity 1200ms 400ms; }
  #outro .tagline b { color: var(--brick); }
  #outro .meta { position: absolute; left: 0; right: 0; top: 66%; text-align: center; font-size: 22px; color: var(--muted); opacity: 0; transition: opacity 1200ms 900ms; }
  #outro .credit { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; font-size: 16px; color: #a99b90; opacity: 0; transition: opacity 1200ms 1400ms; }
  #outro.on .tagline, #outro.on .meta, #outro.on .credit { opacity: 1; }

  /* chương */
  #chapter { position: absolute; inset: 0; background: var(--night); color: #F4ECE4; display: grid; place-items: center;
      opacity: 0; pointer-events: none; transition: opacity 700ms; z-index: 40; }
  #chapter.on { opacity: 1; }
  #chapter .when { font-size: 24px; letter-spacing: 6px; text-transform: uppercase; color: var(--coral); font-weight: 800; text-align: center; }
  #chapter .what { font-size: 92px; font-weight: 900; letter-spacing: -3px; text-align: center; margin-top: 10px; }

  /* phụ đề */
  #caption { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); max-width: 1400px; z-index: 60;
      padding: 14px 30px; border-radius: 18px; background: rgba(31,26,23,.82); color: #fff; font-size: 31px; font-weight: 600;
      line-height: 1.35; text-align: center; opacity: 0; transition: opacity 300ms; pointer-events: none; }
  #caption.on { opacity: 1; }
  #caption .who { color: #FFB59E; font-weight: 800; margin-right: 10px; }

  /* con trỏ */
  #cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; z-index: 80; pointer-events: none;
      transition: transform 650ms cubic-bezier(.3,.7,.2,1), opacity 300ms; opacity: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
  #cursor.on { opacity: 1; }
  .ripple { position: absolute; width: 56px; height: 56px; margin: -28px; border-radius: 50%; border: 3px solid var(--coral);
      z-index: 79; pointer-events: none; animation: ripple 650ms ease-out forwards; }
  @keyframes ripple { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }

  /* ---------- bản dọc ---------- */
  body.vertical .side { display: none; }
  body.vertical #caption { bottom: 70px; max-width: 980px; font-size: 38px; }
  body.vertical .logo { font-size: 120px; }
  body.vertical #chat .box { width: 900px; }
  body.vertical #chapter .what { font-size: 80px; }
</style>
</head>
<body>
<div id="bg"><div class="dotgrid"></div></div>

<div class="side" id="sideL" style="left:150px"></div>
<div class="side" id="sideR" style="right:150px"></div>
<div class="tag" id="tagThu"></div>
<div class="tag" id="tagKhoa"></div>
<div class="phone" id="phoneThu"><iframe id="thu" allow="camera; clipboard-write"></iframe></div>
<div class="phone" id="phoneKhoa"><iframe id="khoa" allow="camera; clipboard-write"></iframe></div>

<!-- thẻ kể chuyện -->
<div class="card dark" id="intro"><div class="logo">Chấm<i></i></div></div>
<div class="card dark" id="map">
  <svg width="900" height="900" viewBox="0 0 900 900">
    <path class="road" id="road" d="M 470 130 C 330 260, 600 380, 470 500 S 330 700, 520 790"/>
    <circle cx="470" cy="130" r="12" fill="#FF6F52"/><text class="city" x="500" y="142">Hà Nội</text>
    <circle cx="520" cy="790" r="12" fill="#FF6F52" opacity=".9"/><text class="city" x="550" y="802">Sài Gòn</text>
    <text class="km" x="150" y="470">hơn một nghìn cây số</text>
    <circle class="traveler" r="16" fill="#FFB59E" style="offset-path: path('M 470 130 C 330 260, 600 380, 470 500 S 330 700, 520 790'); offset-distance: 0%"/>
  </svg>
</div>
<div class="card light" id="chat">
  <div class="box">
    <div class="peer"><div class="av">🐻</div>Khoa</div>
    <div class="old">Hôm nào rảnh cà phê nha 😄</div>
    <div class="seen">Đã xem · 3 tuần trước</div>
    <div class="input"><span id="typed"></span><span class="caret"></span><div class="send">➤</div></div>
  </div>
</div>
<div class="card dark" id="night">
  <div class="glow"></div>
  <div class="ph"><div class="screen"><div class="msg"><b>Thư 🌸</b>Hôm nào rảnh cà phê nha 😄</div></div></div>
</div>
<div class="card dark" id="silence">
  <svg width="1200" height="400" viewBox="0 0 1200 400">
    <line x1="260" y1="200" x2="940" y2="200"/>
    <circle class="a" cx="260" cy="200" r="16"/><circle class="b" cx="940" cy="200" r="16"/>
  </svg>
</div>
<div class="card light" id="outro">
  <div class="logo">Chấm<i></i></div>
  <div class="tagline">Chia sẻ một ngày, <b>chỉ bằng một chạm.</b></div>
  <div class="meta">Android · Web</div>
  <div class="credit" id="credit"></div>
</div>

<div id="chapter"><div><div class="when" id="chWhen"></div><div class="what" id="chWhat"></div></div></div>
<div id="caption"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12 14 L19 14 Z" fill="#1F1A17" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const vertical = params.get('v') === '1';
if (vertical) document.body.classList.add('vertical');
const W = vertical ? 1080 : 1920, H = vertical ? 1920 : 1080;

// --- Dial ở intro: 19 chấm, vòng 6 / 6 / 7 giống app ---
const EMOJI = ['☕','💧','🏃','🍽️','💻','📖','🧘','🚶','🌙','🏠','🎧','🐾','🍲','🪴','🏋️','🎬','✏️','🛍️','🚲'];
const RINGS = [[6, 120], [6, 215], [7, 305]];
(() => {
  const intro = $('intro');
  RINGS.forEach(([, r]) => { const d = document.createElement('div'); d.className = 'ring'; d.style.width = d.style.height = 2 * r + 'px'; intro.appendChild(d); });
  let k = 0;
  RINGS.forEach(([n, r], ring) => {
    for (let i = 0; i < n; i++, k++) {
      const a = -Math.PI / 2 + 2 * Math.PI * i / n + (ring % 2 ? Math.PI / n : 0);
      const d = document.createElement('div'); d.className = 'dot';
      d.innerHTML = `<span>${EMOJI[k]}</span>`;
      // vị trí "rải rác" trước khi thành vòng
      const sx = (Math.sin(k * 12.9898) * 43758.5453 % 1) * 1500, sy = (Math.sin(k * 78.233) * 12345.678 % 1) * 800;
      d.dataset.scatter = `translate(${sx}px, ${sy}px)`;
      d.dataset.ring = `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r}px)`;
      d.style.transform = d.dataset.scatter + ' scale(.2)';
      intro.appendChild(d);
    }
  });
})();

const timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));

const anim = {
  intro() {
    const intro = $('intro'); intro.classList.remove('ringed', 'show-logo');
    const dots = [...intro.querySelectorAll('.dot')];
    dots.forEach((d, i) => later(250 + i * 260, () => { d.style.opacity = 1; d.style.transform = d.dataset.scatter + ' scale(.55)'; }));
    later(6400, () => { intro.classList.add('ringed'); dots.forEach((d, i) => later(i * 30, () => d.style.transform = d.dataset.ring + ' scale(1)')); });
    later(10600, () => intro.classList.add('show-logo'));
  },
  map() {
    const t = document.querySelector('#map .traveler'); t.style.transition = 'none'; t.style.offsetDistance = '0%';
    later(600, () => { t.style.transition = 'offset-distance 3.4s ease-in-out'; t.style.offsetDistance = '100%'; });
  },
  chat() {
    const el = $('typed'); el.textContent = '';
    const text = 'dạo này sao rồi?';
    [...text].forEach((c, i) => later(500 + i * 120, () => el.textContent += c));
    const start = 500 + text.length * 120 + 1300;
    [...text].forEach((_, i) => later(start + i * 55, () => el.textContent = el.textContent.slice(0, -1)));
  },
  night() {
    document.querySelector('#night .screen').classList.remove('off'); document.querySelector('#night .glow').classList.remove('off');
    later(4300, () => { document.querySelector('#night .screen').classList.add('off'); document.querySelector('#night .glow').classList.add('off'); });
  },
  silence() {
    const s = $('silence'); s.classList.remove('fade'); s.querySelector('line').classList.remove('gone');
    later(1500, () => { s.classList.add('fade'); s.querySelector('line').classList.add('gone'); });
  },
  outro() {},
};

window.stage = {
  card(name) {
    timers.splice(0).forEach(clearTimeout);
    document.querySelectorAll('.card').forEach((c) => c.classList.toggle('on', c.id === name));
    anim[name]?.();
  },
  hideCards() { document.querySelectorAll('.card').forEach((c) => c.classList.remove('on')); },

  load(thuUrl, khoaUrl) { $('thu').src = thuUrl; $('khoa').src = khoaUrl; },

  /** Bố cục điện thoại: 'none' | 'thu' | 'two' | 'apart' | 'khoa' */
  layout(mode) {
    const pt = $('phoneThu'), pk = $('phoneKhoa'), tt = $('tagThu'), tk = $('tagKhoa');
    const place = (el, x, y, on) => { el.style.left = x + 'px'; el.style.top = y + 'px'; el.classList.toggle('on', on); };
    const tag = (el, x, on) => { el.style.left = x + 'px'; el.classList.toggle('on', on); };
    if (!vertical) {
      const c = W / 2 - 207, y = 92;
      const L = { none: [c, c, false, false], thu: [c, c, true, false], two: [c - 260, c + 260, true, true],
                  apart: [c - 420, c + 420, true, true], khoa: [c, c, false, true] }[mode];
      place(pt, L[0], y, L[2]); place(pk, L[1], y, L[3]);
      tag(tt, L[0], L[2] && mode !== 'thu'); tag(tk, L[1], L[3]);
    } else {
      // Dọc: một máy thì phóng to giữa màn; hai máy thì xếp chéo, hơi thu nhỏ.
      const one = (el, on) => { el.style.left = (W / 2 - 207) + 'px'; el.style.top = '300px'; el.style.transform = on ? 'scale(1.18)' : 'translateY(80px) scale(.96)'; el.classList.toggle('on', on); };
      if (mode === 'thu' || mode === 'none') { one(pt, mode === 'thu'); one(pk, false); tt.classList.remove('on'); tk.classList.remove('on'); }
      else if (mode === 'khoa') { one(pk, true); one(pt, false); }
      else {
        pt.style.transform = pk.style.transform = 'scale(.92)';
        place(pt, 40, 110, true); place(pk, W - 454, 790, true);
        tt.style.top = '36px'; tk.style.top = '712px'; tag(tt, 40, true); tag(tk, W - 454, true);
      }
    }
  },
  tags(thu, khoa) { $('tagThu').innerHTML = thu; $('tagKhoa').innerHTML = khoa; },
  side(which, html) { const el = $(which === 'L' ? 'sideL' : 'sideR'); if (html) { el.innerHTML = html; el.classList.add('on'); } else el.classList.remove('on'); },

  chapter(when, what) { this.caption(''); this.cursorOff(); $('chWhen').textContent = when; $('chWhat').textContent = what; $('chapter').classList.add('on'); },
  chapterOff() { $('chapter').classList.remove('on'); },

  caption(text, who) { const c = $('caption'); if (!text) return c.classList.remove('on'); c.innerHTML = (who ? `<span class="who">${who}</span>` : '') + text; c.classList.add('on'); },
  credit(text) { $('credit').textContent = text; },

  cursor(x, y, ms = 650) { const c = $('cursor'); c.style.transitionDuration = ms + 'ms, 300ms'; c.style.transform = `translate(${x - 6}px, ${y - 3}px)`; c.classList.add('on'); },
  cursorOff() { $('cursor').classList.remove('on'); },
  ripple(x, y) { const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 700); },
};
stage.layout('none');
</script>
</body>
</html>
