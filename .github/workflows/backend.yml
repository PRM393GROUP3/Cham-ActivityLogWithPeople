name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main-onlymerge]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  # Deploy by hand from the Actions tab (e.g. to redeploy without a code change).
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generated Env types are up to date
        run: npx wrangler types --check

      - run: npm run typecheck

      - run: npm test

      - name: Build Worker bundle (no upload)
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main-onlymerge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    # Never run two deploys/migrations at the same time; queue them instead.
    concurrency:
      group: backend-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Migrations run before the new code goes live, so keep them backward compatible
      # with the currently deployed Worker (add columns/tables; don't drop or rename in one step).
      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "${{ steps.deploy.outputs.url }}/health"
